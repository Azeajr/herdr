# Paste matrix — first scenario family (D3).
# Characterization suite: every remote cell is compared against its local
# counterpart (oracle). Known bugs get pinned cells with expected divergence.
# No runner exists yet; this manifest is the contract for it.

[scenario]
id = "paste-matrix"
family = "characterization"
determinism_tier = "live-real"   # real TUI clients on local lab servers

[topology]
servers = ["a", "b"]
peer = "a->b"

[[payload]]
kind = "tiny"        # a few ASCII chars
[[payload]]
kind = "large"       # ~64 KiB
[[payload]]
kind = "multibyte"   # CJK + emoji + combining marks
[[payload]]
kind = "ansi"        # SGR/OSC sequences interleaved with text

# source × target × payload generated by the harness from the axes below.
[axes.source]
values = ["osc52", "bracketed-paste", "middle-click", "copy-command"]

[axes.target]
values = ["local:a:p1", "peer:b:w1:p1"]   # second reached via a->b

[oracle]
rule = "local-counterpart"   # remote cell passes iff identical to its local cell result

# Example of a pinned known-bug cell once identified:
# [[pins]]
# cell = "osc52/peer:b:w1:p1/large"
# expected_divergence = "<describe observed bug>"
# note = "regression guard; fails if divergence disappears or changes"
